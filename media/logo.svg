<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A link that opens.

       The control renders a URL column as a real link instead of as text, on a
       form and in a view, so the mark is the external link glyph: a frame with
       its top right corner missing and the arrow that left through it.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family rather
       than beside it. Declared in userSpaceOnUse and spanning the whole 96
       canvas, so the mark reads as one object lit from the top right.

       Drawn for 32px. A chain was the obvious first answer and it does not
       survive: two interlocking rounded halves with a bar between them, at any
       weight heavy enough to see at 32, close into a single PILL. Drawing it
       white on a card only made a lighter pill. The chain needs three gaps the
       size of the stroke, and at 32 the stroke is the gap.

       The frame stops short on both sides of the missing corner rather than
       being cut once, so the opening is read as a corner and not as a break.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="toolkit-ramp" x1="6" y1="80" x2="90" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- The frame, open at the top right. -->
  <path d="M50 20 H30 A12 12 0 0 0 18 32 V66 A12 12 0 0 0 30 78 H64 A12 12 0 0 0 76 66 V46"
        stroke="url(#toolkit-ramp)" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- What left through it. -->
  <path d="M46 50 L80 16" stroke="url(#toolkit-ramp)" stroke-width="10" stroke-linecap="round"/>
  <path d="M58 16 H80 V38" stroke="url(#toolkit-ramp)" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
